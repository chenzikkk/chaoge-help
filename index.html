<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>超哥上门帮你办</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
      background: #000;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 整张图片完整显示 */
    .bg {
      position: absolute;
      inset: 0;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      z-index: 1;
    }

    /* 顶部渐变，让文字更清楚 */
    .gradient-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 35%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
      z-index: 2;
      pointer-events: none;
    }

    /* 文字区域：移动到图片顶部内部 */
    .text-area {
      position: absolute;
      top: 22px;   
      left: 0;
      right: 0;
      text-align: center;
      z-index: 3;
      color: white;
      padding: 0 16px;
    }

    .title {
      font-size: 26px;
      font-weight: 1100;
      color: #FFD600;
      letter-spacing: 2px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.85);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.9;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      margin-bottom: 10px;
    }

    .services {
      font-size: 12px;
      line-height: 1.7;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      max-width: 520px;
      margin: 0 auto;
    }

    .services span {
      display: inline-block;
      margin: 0 6px;
      white-space: nowrap;
    }

    /* 底部注释 */
    .note {
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.85;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
    }

    @media (max-width: 480px) {
      .title { font-size: 22px; }
      .subtitle { font-size: 12px; }
      .services { font-size: 11px; }
      .note { font-size: 10px; }
    }

  </style>
</head>
<body>

  <img class="bg" src="chaoge.jpg">

  <div class="gradient-top"></div>

  <div class="text-area">
    <div class="title">超哥上门帮你办</div>
    <div class="subtitle">24小时在线 · 30分钟上门 · 微信/电话均可预约</div>

    <div class="services">
      <span>理财险</span>
      <span>寿险</span>
      <span>资产分配</span>
      <span>法律咨询</span>
      <span>情感解惑</span>
      <span>纠纷解决</span>
      <span>房产交易</span>
      <span>生猪配种</span>
      <span>管道疏通（仅女顾客）</span>
      <span>博彩下注</span>
      <span>废品收购</span>
      <span>QQ盗号</span>
      <span>私房写真</span>
    </div>

    <div class="note">*22点后管道疏通自带“工具”</div>
  </div>

</body>
</html>
